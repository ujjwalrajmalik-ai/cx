<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Keylogger</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #amazon-view {
            background-color: #f2f2f2;
            border: 1px solid #ccc;
            padding: 20px;
            max-width: 800px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        #telegram-input {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div id="amazon-view" >
        <iframe src="https://www.amazon.in" frameborder="0"></iframe>
    </div>

    <label for="telegram-input">Send data to Telegram:</label>
    <textarea id="telegram-input" placeholder="Paste keylogger data here"></textarea>
    <button onclick="sendTelegram()">Send</button>

    <script>
        function sendTelegram() {
            // Get the value from the textarea.
            const data = document.getElementById('telegram-input').value;

            // Send to Telegram bot using your token and user ID.
            fetch('/api/telegram', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ data })
            })
            .then(response => response.text())
            .then(message => console.log('Message sent to Telegram:', message));

        }
    </script>
</body>
</html>
