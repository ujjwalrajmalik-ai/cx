<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <!-- Telegram Web App Script -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #18222d; color: white; margin: 0; padding: 15px; text-align: center; }
    .hidden { display: none !important; }
    .card { background: #242f3d; padding: 15px; margin: 10px 0; border-radius: 10px; text-align: left; }
    .btn { background: #2ea6ff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; font-size: 14px; }
    .btn:disabled { background: #555; }
    input { padding: 10px; width: calc(100% - 22px); margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
    #loader { color: #2ea6ff; font-weight: bold; margin-top: 15px; }
    .error-msg { color: #ff6b6b; font-weight: bold; }
    
    /* SMS UI Design */
    .sms-container { background: #1c2733; padding: 10px; border-radius: 8px; margin-top: 10px; max-height: 250px; overflow-y: auto; }
    .sms-bubble { background: #2b5278; color: #fff; padding: 10px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid #2ea6ff; }
    .sms-header { font-size: 11px; color: #8da1b5; margin-bottom: 5px; display: flex; justify-content: space-between; }
    .sms-text { font-size: 14px; word-wrap: break-word; }
  </style>
</head>
<body>

  <!-- Security Block Screen (Chrome/Safari के लिए) -->
  <div id="accessDenied" class="hidden">
    <h2 style="color:#ff6b6b;">Access Denied 🛑</h2>
    <p>Please open this store directly inside the Telegram app.</p>
  </div>

  <!-- Main App Content -->
  <div id="mainApp" class="hidden">
    <h2>Virtual Number Store</h2>
    <p style="font-size: 18px;">Balance: <b style="color:#2ea6ff;">$<span id="balance">0</span></b></p>

    <!-- Navigation -->
    <button class="btn" onclick="showSection('numbersSection')">Buy Numbers</button>
    <button class="btn" onclick="showSection('addMoneySection')">Add Funds</button>

    <!-- Numbers Section -->
    <div id="numbersSection">
      <h3>Available Numbers</h3>
      <div id="numbersList">Loading numbers...</div>
    </div>

    <!-- Add Money Section -->
    <div id="addMoneySection" class="card hidden">
      <h3 style="text-align:center;">Add Funds (BTC)</h3>
      <div style="text-align:center;">
        <button class="btn" onclick="selectAmount(200)">$200</button>
        <button class="btn" onclick="selectAmount(450)">$450</button>
        <button class="btn" onclick="selectAmount(700)">$700</button>
        <button class="btn" onclick="selectAmount(900)">$900</button>
      </div>
      
      <div id="paymentForm" class="hidden" style="margin-top: 15px; text-align:center;">
        <p>Send <b>$<span id="selectedAmount"></span></b> in BTC to:</p>
        <p style="background:#111; padding:10px; font-family:monospace; user-select:all; border-radius:5px;">bc1q_dummy_fake_address_xyz123</p>
        <input type="text" id="utrInput" placeholder="Enter Transaction ID / UTR">
        <button class="btn" onclick="submitPayment()" style="width:100%;">Submit Payment</button>
      </div>
    </div>

    <!-- SMS Inbox Section -->
    <div id="smsSection" class="card hidden">
      <h3 style="text-align:center;">Inbox: <span id="currentNumberViewing"></span></h3>
      <button class="btn" onclick="showSection('numbersSection')" style="width: 100%; margin: 0 0 10px 0; background: #555;">Back to Numbers</button>
      <button class="btn" id="refreshSmsBtn" style="width: 100%; margin: 0 0 10px 0;">Refresh Inbox 🔄</button>
      
      <div id="smsInboxList" class="sms-container">
        <!-- SMS Messages will load here -->
      </div>
    </div>

    <!-- Loader Notification -->
    <div id="loader"></div>
  </div>

  <script>
    // ⚠️ यहाँ अपना लेटेस्ट Web App URL डालें
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwtSGFAkbrmIUVkopdDD4jVavcngXn1QdCPZuxFzza0BQphVeyREPCqBLuNfgurnLeX/exec"; 

    let userId = null;
    let selectedAddAmount = 0;
    let currentSmsSheet = "";

    // === 1. INITIALIZATION & SECURITY CHECK ===
    window.onload = function() {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();

      // Telegram के Unsafe डेटा से डायरेक्ट यूज़र आईडी निकालना
      const user = window.Telegram.WebApp.initDataUnsafe?.user;

      if (user && user.id) {
        // अगर टेलीग्राम के अंदर है, तो आईडी सेव करें और ऐप दिखाएं
        userId = user.id;
        document.getElementById("mainApp").classList.remove("hidden");
        fetchInitialData();
      } else {
        // अगर क्रोम या ब्राउज़र में है, तो एक्सेस डिनाई करें
        document.getElementById("accessDenied").classList.remove("hidden");
      }
    };

    // === 2. NAVIGATION LOGIC ===
    function showSection(sectionId) {
      document.getElementById('numbersSection').classList.add('hidden');
      document.getElementById('addMoneySection').classList.add('hidden');
      document.getElementById('smsSection').classList.add('hidden');
      document.getElementById(sectionId).classList.remove('hidden');
    }

    // === 3. FETCH DATA (BALANCE & NUMBERS) ===
    function fetchInitialData() {
      showLoader("Connecting to database...");
      
      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "fetchData",
          userId: userId // सीधे यूज़र आईडी भेज रहे हैं
        })
      })
      .then(res => res.json())
      .then(data => {
        hideLoader();
        if (data.success) {
          document.getElementById("balance").innerText = data.balance;
          renderNumbers(data.numbers, data.balance);
        } else {
          showLoader("<span class='error-msg'>" + data.error + "</span>");
        }
      })
      .catch(err => {
        hideLoader();
        showLoader("<span class='error-msg'>Connection Failed!</span>");
      });
    }

    // === 4. RENDER NUMBERS ===
    function renderNumbers(numbers, balance) {
      let html = "";
      if (numbers.length === 0) {
        html = "<p>No numbers available.</p>";
      } else {
        numbers.forEach(num => {
          html += `
            <div class="card">
              <b>${num.number}</b> - $${num.price} <br>
              <button class="btn" style="margin-top: 10px; width:100%;" 
                      onclick="openSMSInbox('${num.number}', '${num.smsSheetName}')">
                Open Inbox
              </button>
            </div>
          `;
        });
      }
      document.getElementById("numbersList").innerHTML = html;
    }

    // === 5. ADD FUNDS LOGIC ===
    function selectAmount(amount) {
      selectedAddAmount = amount;
      document.getElementById("selectedAmount").innerText = amount;
      document.getElementById("paymentForm").classList.remove("hidden");
    }

    function submitPayment() {
      const utr = document.getElementById("utrInput").value;
      if (!utr) {
        Telegram.WebApp.showAlert("Please enter UTR!");
        return;
      }

      showLoader("Submitting UTR...");
      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "submitUTR",
          userId: userId, // सीधे यूज़र आईडी भेज रहे हैं
          utr: utr,
          amount: selectedAddAmount
        })
      })
      .then(res => res.json())
      .then(data => {
        hideLoader();
        if (data.success) {
          Telegram.WebApp.showAlert("UTR Submitted! Balance will be updated after verification.");
          document.getElementById("utrInput").value = "";
          showSection('numbersSection');
        }
      });
    }

    // === 6. SMS INBOX LOGIC ===
    function openSMSInbox(numberStr, sheetName) {
      currentSmsSheet = sheetName;
      document.getElementById("currentNumberViewing").innerText = numberStr;
      showSection('smsSection');
      fetchSMSData(); // तुरंत लोड करें
    }

    document.getElementById("refreshSmsBtn").addEventListener("click", () => {
      fetchSMSData(); // मैन्युअल रिफ्रेश
    });

    function fetchSMSData() {
      document.getElementById("smsInboxList").innerHTML = "<i>Loading messages...</i>";
      const btn = document.getElementById("refreshSmsBtn");
      btn.innerText = "Loading... ⏳";
      btn.disabled = true;
      
      // 5-second simulated delay (जैसा आपने पहले मांगा था)
      setTimeout(() => {
        fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "fetchSMS",
            userId: userId, // सीधे यूज़र आईडी भेज रहे हैं
            smsSheet: currentSmsSheet
          })
        })
        .then(res => res.json())
        .then(data => {
          btn.innerText = "Refresh Inbox 🔄";
          btn.disabled = false;

          if (data.success) {
            renderSMS(data.messages);
          } else {
            document.getElementById("smsInboxList").innerHTML = `<span class='error-msg'>${data.error}</span>`;
          }
        })
        .catch(err => {
          btn.innerText = "Refresh Inbox 🔄";
          btn.disabled = false;
          document.getElementById("smsInboxList").innerHTML = `<span class='error-msg'>Failed to load SMS.</span>`;
        });
      }, 5000); 
    }

    function renderSMS(messages) {
      let html = "";
      // नए SMS सबसे ऊपर दिखाने के लिए एरे को उल्टा (Reverse) किया गया है
      const reversedMessages = [...messages].reverse(); 

      if (reversedMessages.length === 0) {
        html = "<p style='text-align:center; color:#8da1b5; padding: 20px 0;'>No messages found.</p>";
      } else {
        reversedMessages.forEach(sms => {
          html += `
            <div class="sms-bubble">
              <div class="sms-header">
                <span><b>${sms.sender}</b></span>
                <span>To: ${sms.number}</span>
              </div>
              <div class="sms-text">${sms.text}</div>
            </div>
          `;
        });
      }
      document.getElementById("smsInboxList").innerHTML = html;
    }

    // === 7. UTILS ===
    function showLoader(msg) {
      document.getElementById("loader").innerHTML = msg;
    }
    function hideLoader() {
      document.getElementById("loader").innerHTML = "";
    }
  </script>
</body>
</html>
