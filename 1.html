<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e231b">
<title>Arogya</title>
<style>
:root{--bg:#0e231b;--s1:#153126;--s2:#1b3b2f;--s3:#24493b;--ln:rgba(238,228,204,.11);--tx:#efe7d3;--mu:#9bb0a3;--gd:#cba85f;--er:#e07d6e;--ok:#83c39c;--ease:cubic-bezier(.22,1,.36,1);--spr:cubic-bezier(.34,1.45,.64,1);--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;padding-bottom:calc(96px + var(--sab));overscroll-behavior-y:none}
body.ovl{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
h2,h3,p{margin:0}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) 12px 10px;background:rgba(14,35,27,.86);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--ln)}
body.ovl .top{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px;color:var(--gd);min-width:96px}
.brand b{display:block;font-size:16px;color:var(--tx);line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--mu);min-height:15px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{position:relative;flex:1;display:flex;background:var(--s1);border-radius:12px;padding:3px}
.seg i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:9px;background:var(--s3);transition:transform .4s var(--spr)}
.seg[data-t=h] i{transform:translateX(100%)}
.seg button{position:relative;flex:1;padding:7px 0;font-weight:600;color:var(--mu);transition:color .2s}
.seg[data-t=c] button:first-of-type,.seg[data-t=h] button:last-of-type{color:var(--tx)}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mu);flex:none;transition:transform .25s var(--spr),background .2s}
.ib:active{transform:scale(.88);background:var(--s2)}
main{max-width:760px;margin:0 auto;padding:0 12px}
.pane{display:none}.pane.on{display:block}
.srch{display:flex;align-items:center;gap:10px;height:46px;margin:12px 0;padding:0 14px;background:var(--s1);border:1px solid var(--ln);border-radius:14px;color:var(--mu)}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;padding:0;color:var(--tx);font:inherit;font-size:16px}
.srch input::placeholder{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;height:172px;padding:14px 8px;background:var(--s1);border:1px solid var(--ln);border-radius:18px;box-shadow:0 3px 10px rgba(0,0,0,.16);cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 172px;contain:layout paint style;transition:transform .3s var(--spr)}
.card:active{transform:scale(.97)}
.card b{max-width:100%;margin-top:10px;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{font-size:12px;color:var(--gd)}
.av{--sz:88px;position:relative;flex:none;width:var(--sz);height:var(--sz);border-radius:50%;overflow:hidden;background:linear-gradient(140deg,#2d6a52,#8d7841);display:grid;place-items:center;color:rgba(255,255,255,.72);font-weight:600;font-size:calc(var(--sz)*.4)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
img.in{opacity:1!important}
.rise{animation:rise .5s var(--ease) backwards;animation-delay:calc(var(--i)*35ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.empty{padding:56px 10px;text-align:center;color:var(--mu)}
.fab{position:fixed;right:16px;bottom:calc(18px + var(--sab));z-index:6;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--gd);color:#1a2a20;box-shadow:0 8px 20px rgba(0,0,0,.35);transition:transform .3s var(--spr)}
.fab .i{width:24px;height:24px;stroke-width:2}
.fab:active{transform:scale(.9)}
body.ovl .fab{transform:scale(0);pointer-events:none}
/* herbal */
.ctl{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.seg2{display:flex;background:var(--s1);border-radius:10px;padding:2px}
.seg2 button{padding:5px 12px;border-radius:8px;color:var(--mu);font-weight:600;transition:background .2s,color .2s}
.seg2 .on{background:var(--s3);color:var(--tx)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--s1);border:1px solid var(--ln);color:var(--tx);white-space:nowrap;transition:transform .2s var(--spr),background .2s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--gd);border-color:var(--gd);color:#1a2a20;font-weight:600}
.chip .i{width:14px;height:14px}
.notes{display:flex;flex-direction:column;gap:10px}
.note{display:flex;align-items:center;gap:12px;height:88px;padding:0 6px 0 14px;background:var(--s1);border:1px solid var(--ln);border-radius:16px;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 88px;contain:layout paint style;transition:transform .3s var(--spr)}
.note:active{transform:scale(.985)}
.note .m{flex:1;min-width:0}
.note b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note p{color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:20px}
.note .tg{display:block;color:var(--gd);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:17px}
.star{color:var(--mu)}.star.on{color:var(--gd)}.star.on .i{fill:currentColor}
.sq{width:60px;height:60px;border-radius:12px!important;margin-right:6px}
.az{height:28px;padding:8px 4px 0;color:var(--gd);font-weight:600}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(4,14,10,.62);animation:fade .25s backwards}
.ov.tp.mod .scrim{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sh{position:relative;display:flex;flex-direction:column;width:100%;max-width:640px;max-height:94vh;max-height:94dvh;background:var(--s1);border:1px solid var(--ln);border-bottom:0;border-radius:24px 24px 0 0;padding-bottom:var(--sab);animation:up .5s var(--ease) backwards;will-change:transform}
.sh.full{height:96vh;height:96dvh}
.sh.sm{max-width:480px}
.ov.nov .sh{animation:none}
.ov.out .sh{animation:down .26s var(--ease) forwards}
.ov.out .scrim{animation:fadeo .26s forwards}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes fadeo{to{opacity:0}}
.grab{flex:none;touch-action:none;cursor:grab}
.grab:before{content:"";display:block;width:38px;height:4px;margin:8px auto 0;border-radius:2px;background:rgba(238,228,204,.25)}
.hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px;padding:0 10px 4px}
.hd:before{flex:0 0 100%}
.hd .ttl,.hd>b{flex:1;min-width:0;text-align:center;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 16px 24px}
.cf{padding:18px 18px 20px}.cf h3{font-size:16px;margin-bottom:6px}.cf p{color:var(--mu)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0 8px}
.hero .av{--sz:112px}
.hero h2{margin:14px 0 2px;font-size:22px;font-weight:650}
.sub{color:var(--gd)}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
.tags span{padding:3px 10px;border-radius:999px;background:var(--s3);font-size:12px}
.sec{margin-top:14px;padding:12px 14px 6px;background:var(--s2);border:1px solid var(--ln);border-radius:18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.sec-h h3{font-size:14px;font-weight:600;color:var(--mu)}
.sec-h em{font-style:normal;color:var(--tx);margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;background:var(--gd);color:#1a2a20;font-weight:600;transition:transform .25s var(--spr)}
.pill:active{transform:scale(.93)}
.pill .i{width:14px;height:14px;stroke-width:2.2}
.row{display:flex;align-items:center;gap:12px;min-height:76px;padding:6px 0;border-top:1px solid var(--ln)}
.row:first-child{border-top:0}
.row.s{min-height:60px}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m small{color:var(--mu);font-size:12px}
.row .m p{white-space:pre-wrap;word-break:break-word}
.row .ib{width:34px;height:34px}
.fee{font-weight:600;color:var(--gd);white-space:nowrap}.fee.free{color:var(--mu);font-weight:400}
.th{position:relative;flex:none;width:52px;height:64px;border-radius:10px;background:var(--s3);overflow:hidden;display:grid;place-items:center;color:var(--mu)}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.pg{position:absolute;right:3px;bottom:3px;min-width:18px;padding:0 5px;border-radius:6px;background:rgba(0,0,0,.65);font-size:12px;text-align:center}
.tot{display:flex;justify-content:space-between;padding:10px 0;border-top:1px dashed var(--ln);font-weight:600}
.sk{background:var(--s3);border-radius:6px;animation:pulse 1.3s infinite}
.sk.l1{height:14px;width:60%;margin-bottom:8px}.sk.l2{height:12px;width:35%}
.th.sk{border-radius:10px}
@keyframes pulse{50%{opacity:.45}}
.note-i{color:var(--mu);padding:10px 0;min-height:40px}
.retry{color:var(--gd);text-decoration:underline}
/* forms */
label{display:block;margin:14px 0 6px;font-size:12px;color:var(--mu)}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;color:var(--tx);font:inherit;font-size:16px;outline:0;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--gd)}
input[readonly]{opacity:.6}
textarea{resize:vertical;min-height:84px}
.dt{display:flex;gap:8px;align-items:center}.dt input{flex:1;min-width:0}
.acts{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;padding:13px;border-radius:14px;background:var(--gd);color:#1a2a20;font-weight:650;font-size:16px;transition:transform .25s var(--spr),opacity .2s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.55}
.btn.ghost{background:var(--s3);color:var(--tx)}
.btn.dg{flex:.55;background:transparent;border:1px solid var(--er);color:var(--er)}
.pick{display:flex;justify-content:center;padding-top:14px}
.pick .av{--sz:96px;border:1px dashed rgba(238,228,204,.35);background:var(--s2);color:var(--mu)}
.pick .av img{opacity:1}
.fr{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--ln)}
.fr .th{width:44px;height:56px}
.fr .m{flex:1;min-width:0}.fr b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fr small{color:var(--mu);font-size:12px}
.pb{height:5px;margin-top:6px;border-radius:3px;background:var(--s3);overflow:hidden;display:none}
.up .pb{display:block}
.pb i{display:block;height:100%;background:var(--gd);transform-origin:0 50%;transform:scaleX(0);transition:transform .2s linear}
#upl{margin-top:16px}#upl small{color:var(--mu)}
.err{margin-top:12px;color:var(--er)}
.tb{width:100%;border-collapse:collapse;margin-top:6px}
.tb th,.tb td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--ln)}
.tb th:first-child,.tb td:first-child{text-align:left}.tb th{color:var(--mu);font-weight:500;font-size:12px}
.tb tfoot td{font-weight:650;color:var(--gd);border:0}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--ln)}
.kv span:first-child{color:var(--mu)}.kv.big{border:0;font-weight:650;color:var(--gd)}
.dgr{display:flex;gap:8px;align-items:center;padding:6px 0}.dgr .i{width:16px;height:16px}.dgr.ok .i{color:var(--ok)}.dgr.no .i{color:var(--er)}.dgr small{color:var(--mu);word-break:break-word}
.set-b{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 0;border-bottom:1px solid var(--ln);text-align:left}
.set-b small{color:var(--mu);display:block;font-size:12px}
/* crop */
.crop{position:relative;width:min(80vw,320px);aspect-ratio:1;margin:12px auto;overflow:hidden;touch-action:none;background:#000;border-radius:16px}
.crop canvas{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none}
.mk{position:absolute;inset:8%;border-radius:50%;box-shadow:0 0 0 400px rgba(6,16,12,.66);border:2px solid rgba(255,255,255,.75);pointer-events:none}
/* viewer */
.sh.vw{max-width:none;height:100vh;height:100dvh;max-height:none;border:0;border-radius:0;background:#050c09;animation:fade .25s backwards}
.vbar{display:flex;align-items:center;justify-content:space-between;padding:calc(6px + var(--sat)) 10px 6px;color:#fff}
.vbar:before{display:none}
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior:contain;scrollbar-width:none}
.pager::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;overflow:hidden;touch-action:pan-x;display:grid;place-items:center}
.zm{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}
.zm img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;user-select:none}
.zm img.lo{filter:blur(12px);transform:scale(1.02)}
.zm img.hi{opacity:0;transition:opacity .4s}
.vmsg{color:var(--mu);text-align:center;padding:24px}
.spin{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:var(--gd);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hphoto{position:relative;aspect-ratio:16/10;border-radius:18px;overflow:hidden;background:var(--s3);margin-bottom:12px}
.hphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hphoto img.lo{filter:blur(10px);transform:scale(1.05)}
.hphoto img.hi{opacity:0;transition:opacity .4s}
.hsec{margin-top:12px;padding:12px 14px;background:var(--s2);border:1px solid var(--ln);border-radius:16px}
.hsec h4{margin:0 0 4px;font-size:12px;font-weight:500;color:var(--mu)}
.hsec p{white-space:pre-wrap;word-break:break-word;line-height:1.55}
#toast{position:fixed;left:50%;bottom:calc(88px + var(--sab));z-index:99;max-width:88%;padding:10px 16px;border-radius:14px;background:#08130e;border:1px solid var(--ln);text-align:center;opacity:0;transform:translate(-50%,12px);pointer-events:none;transition:opacity .25s,transform .4s var(--spr)}
#toast.on{opacity:1;transform:translate(-50%,0)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
::view-transition-group(pav){animation-duration:.42s;animation-timing-function:cubic-bezier(.22,1,.36,1)}
.pane.fx{animation:fade .3s var(--ease)}
.hd{touch-action:none}
.slide.z{touch-action:none}.zm.t{transition:transform .28s var(--ease)}
.cf .btn.dg{flex:1;background:var(--er);border:0;color:#2a0f0a}
.set-b .i{color:var(--mu)}
.dt .chip{padding:9px 12px}
.fr .ib{width:34px;height:34px}
.fr .pb{margin-top:8px}
.warn{color:var(--gd)!important}
.pick .av>span{display:grid;place-items:center}
.pick .av>span .i{width:26px;height:26px}
.pick{flex-direction:column;align-items:center;gap:8px}.pick small{color:var(--mu);min-height:17px}
.card.skc .av{animation:pulse 1.3s infinite;background:var(--s3)}
.card.skc .sk{margin-top:12px;height:12px;width:60%}
#more{height:1px}
.cnt{color:var(--mu);font-size:12px;padding:0 2px 8px}
.hero .av span{font-size:44px}
.vmsg .btn{display:inline-block;margin-top:12px;padding:10px 22px;flex:none}
.vmsg{position:absolute;inset:0;display:grid;place-items:center;align-content:center;pointer-events:none}
.vmsg .btn{pointer-events:auto}
.pager .slide{min-height:0}
.ttl.sm{font-size:14px}
.bn{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:30;background:var(--s2);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.bn .bt{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:10px}.bn button{color:var(--gd);background:none;border:0;font:inherit;padding:4px 8px}.bn .pb{margin-top:8px}.bn small{color:var(--mu);font-size:11px}
.fls{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip.sm{padding:5px 10px;font-size:12px}.fee small{display:block;font-size:11px;color:var(--mu);text-align:right}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.chiprow.scr{max-height:140px;overflow:auto;overscroll-behavior:contain}.kv.sub{padding-left:14px;font-size:13px;color:var(--mu)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.01"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 17l-5.2 2.8 1-5.9L3.5 9.8l5.9-.8z"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></symbol>
<symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
<symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14"/><path d="M5 19c3-4 6-6 9-8"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 16l5-4 4 3 3-2 4 3"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20.5H7z"/><path d="M14 3.5v4h4"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></symbol>
</defs></svg>

<header class="top">

<script>
"use strict";
/* ============ CONFIG ============ */
const BOT_TOKEN = "8957893655:AAHo9nB9qAmNZiBLEvsk_UabK0kgQ_No6zE";
const PROFILE_GROUP_ID = "-5324190919";   // client cards + index (bot must be admin: delete + pin)
const DIET_CHANNEL_ID = "-1004295423560"; // diet charts, supplements, notes
const FORMULA_CHANNEL_ID = "-1003973993786"; // formulas / medicines
const SYNC_GROUP_ID = PROFILE_GROUP_ID;    // scratch chat used for reading; put a separate private group here if you make one
/* ================================== */
const CH = { c: PROFILE_GROUP_ID, h: FORMULA_CHANNEL_ID, d: DIET_CHANNEL_ID };
const PAGE_MAX = 3800, ROW = { c: "prof", h: "herb" };

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const el = h => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild };
const ic = (n, c = "") => `<svg class="i ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const iso = d => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const today = () => iso(new Date());
const yest = () => { const d = new Date(); d.setDate(d.getDate() - 1); return iso(d) };
const fdate = s => { if (!s) return "—"; if (s == today()) return "Today"; if (s == yest()) return "Yesterday"; const d = new Date(s + "T00:00"); return isNaN(d) ? s : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) };
const num = v => parseFloat(String(v || "").replace(/[^\d.]/g, "")) || 0;
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const mb = b => b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
const COL = new Intl.Collator("en", { sensitivity: "base", numeric: true });
let tt; function toast(m, ms = 3400) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), ms) }
const setSt = t => { const s = $("#st"); if (s) s.textContent = t };
const RQ = new Set(); const rq = fn => { if (RQ.has(fn)) return; RQ.add(fn); requestAnimationFrame(() => { RQ.delete(fn); fn() }) };
const chain = (o, k, fn) => { const p = o[k].then(fn); o[k] = p.catch(() => { }); return p };

/* ---------- IndexedDB: profiles + avatar blobs (+ small herb index & meta) ---------- */
const DBP = new Promise((res, rej) => { try { const r = indexedDB.open("arogya2", 2); r.onupgradeneeded = () => { const d = r.result, mk = (n, o) => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, o) }; mk("prof", { keyPath: "mob" }); mk("herb", { keyPath: "mid" }); mk("av"); mk("meta"); mk("rec") }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error("blocked")) } catch (e) { rej(e) } });
const idb = (st, mode, fn) => DBP.then(d => new Promise((res, rej) => { const t = d.transaction(st, mode); const q = fn(t.objectStore(st)); t.oncomplete = () => res(q && q.result); t.onerror = t.onabort = () => rej(t.error) })).catch(() => undefined);
const mget = k => idb("meta", "readonly", s => s.get(k)), mset = (k, v) => idb("meta", "readwrite", s => s.put(v, k)), mdel = k => idb("meta", "readwrite", s => s.delete(k));

/* ---------- Telegram API ---------- */
class TGE extends Error { constructor(m, c, p) { super(m); this.code = c; this.params = p || {} } }
const clean = s => String(s || "").split(BOT_TOKEN).join("•••");
let onWait = null;
async function api(method, p = {}) {
  if (!navigator.onLine) throw new TGE("Offline", 0);
  const body = new URLSearchParams();
  for (const k in p) { const v = p[k]; if (v !== undefined && v !== null) body.set(k, typeof v == "object" ? JSON.stringify(v) : String(v)) }
  for (let a = 0; ; a++) {
    let j;
    try { const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/${method}`, { method: "POST", body }); j = await r.json() }
    catch (e) { if (a < 2 && navigator.onLine) { await sleep(700 * (a + 1)); continue } throw new TGE("Network error", 0) }
    if (j.ok) return j.result;
    if (j.error_code == 429 && a < 6) { const w = (j.parameters && j.parameters.retry_after) || 5; Q.penalty(); onWait && onWait(w); await sleep(w * 1000 + 400); onWait && onWait(0); continue }
    throw new TGE(clean(j.description || "Telegram error"), j.error_code, j.parameters)
  }
}
function xhrPost(method, fd, onp, ctl) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest(); x.open("POST", `https://api.telegram.org/bot${BOT_TOKEN}/${method}`); x.responseType = "json";
    x.upload.onprogress = e => e.lengthComputable && onp && onp(e.loaded, e.total);
    x.onload = () => { const j = x.response; if (j && j.ok) res(j.result); else rej(new TGE(clean((j && j.description) || "Upload failed"), x.status, j && j.parameters)) };
    x.onerror = () => rej(new TGE("Network error", 0)); x.ontimeout = () => rej(new TGE("Timed out", 0)); x.onabort = () => rej(new TGE("Cancelled", -1));
    if (ctl) ctl.abort = () => x.abort();
    x.send(fd)
  })
}
async function upload(method, fd, onp, ctl) { for (let a = 0; ; a++) { try { return await xhrPost(method, fd, onp, ctl) } catch (e) { if (e.code == 429 && a < 2) { await sleep(((e.params && e.params.retry_after) || 5) * 1000 + 400); continue } throw e } } }

/* Serial, paced queue for everything that posts into the sync group (Bot API: ~20 msgs/min per group) */
const Q = {
  items: [], busy: false, gap: 1000, last: 0, streak: 0, seq: 0,
  add(fn, prio = 1, skip) { return new Promise((res, rej) => { this.items.push({ fn, prio, skip, res, rej, s: this.seq++ }); this.pump() }) },
  async pump() {
    if (this.busy) return; this.busy = true;
    while (this.items.length) {
      this.items.sort((a, b) => a.prio - b.prio || a.s - b.s); const t = this.items.shift();
      if (t.skip && t.skip()) { t.res(null); continue }
      const w = this.last + this.gap - Date.now(); if (w > 0) await sleep(w);
      this.last = Date.now();
      try { t.res(await t.fn()); if (++this.streak > 25) { this.gap = Math.max(1000, this.gap * .9); this.streak = 0 } } catch (e) { t.rej(e) }
    }
    this.busy = false
  },
  penalty() { this.gap = Math.min(3200, this.gap * 1.6 + 200); this.streak = 0 }
};
const DEL = { l: [], t: 0, push(id) { this.l.push(id); if (!this.t) this.t = setTimeout(() => this.run(), 700) },
  async run() { this.t = 0; while (this.l.length) { const b = this.l.splice(0, 100); try { await api("deleteMessages", { chat_id: SYNC_GROUP_ID, message_ids: b }) } catch (e) { for (const id of b) { try { await api("deleteMessage", { chat_id: SYNC_GROUP_ID, message_id: id }) } catch (_) { } } } } } };
const gone = e => e && e.code == 400 && /not found|can't be forwarded|MESSAGE_ID_INVALID|message to forward/i.test(e.message);
async function fwd(chan, id, prio = 1, skip) {
  const m = await Q.add(() => api("forwardMessage", { chat_id: SYNC_GROUP_ID, from_chat_id: chan, message_id: id, disable_notification: true }), prio, skip);
  if (m) DEL.push(m.message_id); return m
}

/* ---------- caption format ---------- */
const T = { profile: { tag: "Profile", keys: ["Name", "Age", "Weight", "Issue", "Date"] }, diet: { tag: "Diet", keys: ["Date", "To", "Wt", "Fee", "Reason", "Title", "Formulas", "Pages"] }, supp: { tag: "Supplement", keys: ["Name", "Price", "Date"] }, note: { tag: "Note", keys: ["Text", "Date"] }, herb: { tag: "Herb", keys: ["Name", "Ingredients", "Benefits", "Formula", "Results", "Keywords"] } };
const ALLK = [...new Set(Object.values(T).flatMap(t => t.keys))];
const TM = { profile: "profile", diet: "diet", supplement: "supp", note: "note", herb: "herb" };
const us = s => String(s).trim().replace(/#/g, "").replace(/\s+/g, "_");
const snip = s => (s || "").replace(/\s+/g, " ").trim().slice(0, 70);
function cap(type, f) {
  let h = "#" + T[type].tag;
  if (type == "herb") { h += " #Name_" + us(f.Name); (f.tags || "").split(/[,،]+/).map(s => s.trim()).filter(Boolean).forEach(t => h += " #Tag_" + us(t)) } else h += " #Mob_" + f.mob;
  return h + "\n" + T[type].keys.filter(k => f[k]).map(k => k + ": " + f[k]).join("\n")
}
function parseCap(txt) {
  if (!txt) return null; const lines = txt.split("\n");
  const tags = [...lines[0].matchAll(/#([^\s#]+)/g)].map(m => m[1]); const type = TM[(tags[0] || "").toLowerCase()]; if (!type) return null;
  const f = {}; let cur = null;
  lines.slice(1).forEach(l => { const m = l.match(/^([A-Za-z]+):\s?(.*)$/); if (m && ALLK.includes(m[1])) { cur = m[1]; f[cur] = m[2] } else if (cur) f[cur] += "\n" + l });
  const mob = tags.find(x => /^Mob_/i.test(x));
  const tagList = tags.filter(x => /^Tag_/i.test(x)).map(x => x.slice(4).replace(/_/g, " "));
  if (type == "herb" && !f.Name) { const n = tags.find(x => /^Name_/i.test(x)); f.Name = n ? n.slice(5).replace(/_/g, " ") : "Untitled" }
  return { type, f, mob: mob ? mob.slice(4) : "", tagList }
}
function mediaOf(m) {
  if (m.photo && m.photo.length) { const p = m.photo; const sm = p.find(x => x.width >= 300) || p[p.length - 1]; return { kind: "photo", thumb: sm.file_id, full: p[p.length - 1].file_id, size: p[p.length - 1].file_size } }
  if (m.document) { const d = m.document, mt = d.mime_type || ""; return { kind: /pdf/i.test(mt) ? "pdf" : /^image\//i.test(mt) ? "img" : "doc", full: d.file_id, thumb: (d.thumbnail && d.thumbnail.file_id) || "", name: d.file_name, size: d.file_size } }
  return null
}
async function readRec(chan, id, prio, skip) {
  const m = await fwd(chan, id, prio, skip); if (!m) return null;
  const p = parseCap(m.caption || m.text || ""); return p ? { mid: id, type: p.type, f: p.f, tags: p.tagList, media: mediaOf(m), _v: 1 } : null
}
function scanInfo(m, mid) {
  const txt = m.caption || m.text || "";
  if (/^#IndexRoot/.test(txt)) return { type: "idxroot", mid };
  if (/^#IndexPage/.test(txt)) return { type: "idxpage", mid };
  const p = parseCap(txt); if (!p) return null; const md = mediaOf(m);
  if (p.type == "herb") return { type: "herb", mid, name: p.f.Name, tags: p.tagList, kw: p.f.Keywords || "", bn: snip(p.f.Benefits), thumb: md ? md.thumb : "" };
  if (!p.mob) return null;
  if (p.type == "profile") return { type: "profile", mid, mob: p.mob, name: p.f.Name || "", age: p.f.Age || "", wt: p.f.Weight || "", date: p.f.Date || "", thumb: md ? md.thumb : "" };
  return { type: p.type, mid, mob: p.mob }
}

/* ---------- index (lives in Telegram: 1 pinned root + text pages) ---------- */
const cl = s => String(s ?? "").replace(/[|\n\r]/g, " ").replace(/\s+/g, " ").trim();
const ids = s => s ? s.split(",").map(Number).filter(Boolean) : [];
const KD = {
  c: { key: "mob",
    ser: e => [e.mob, cl(e.name), e.pid || "", e.av || "", cl(e.age), cl(e.wt), e.date || "", (e.d || []).join(","), (e.s || []).join(","), (e.n || []).join(",")].join("|"),
    par: l => { const a = l.split("|"); return a[0] && a.length >= 10 ? { mob: a[0], name: a[1], pid: +a[2] || 0, av: a[3], age: a[4], wt: a[5], date: a[6], d: ids(a[7]), s: ids(a[8]), n: ids(a[9]) } : null } },
  h: { key: "mid",
    ser: e => [e.mid, cl(e.name), (e.tags || []).map(t => cl(t).replace(/;/g, " ")).join(";"), cl(e.kw).slice(0, 80), cl(e.bn).slice(0, 70), e.thumb || "", e.fav ? 1 : 0].join("|"),
    par: l => { const a = l.split("|"); return +a[0] && a.length >= 7 ? { mid: +a[0], name: a[1], tags: a[2] ? a[2].split(";") : [], kw: a[3], bn: a[4], thumb: a[5], fav: a[6] == "1" } : null } }
};
const blank = (k, key) => k == "c" ? { mob: key, name: "", pid: 0, av: "", age: "", wt: "", date: "", d: [], s: [], n: [] } : { mid: key, name: "", tags: [], kw: "", bn: "", thumb: "", fav: false };
const pageText = (v, lines) => `#IndexPage v${v}\n` + lines.join("\n");
const rootText = (v, pages) => `#IndexRoot\nv: ${v}\np: ${pages.map(p => p.id + "." + p.ver).join(", ")}`;
function parseRoot(t) { if (!/^#IndexRoot/.test(t || "")) return null; const v = +((t.match(/^v:\s*(\d+)/m) || [])[1]) || 0; const p = ((t.match(/^p:\s*(.*)$/m) || [])[1] || "").split(",").map(x => x.trim()).filter(Boolean).map(x => { const [i, vv] = x.split("."); return { id: +i, ver: +vv || 1 } }); return { v, pages: p } }
function parsePage(t) { const l = (t || "").split("\n"); if (!/^#IndexPage/.test(l[0])) return null; return { ver: +((l[0].match(/v(\d+)/) || [])[1]) || 1, lines: l.slice(1).filter(Boolean) } }
const ne = e => { if (!/not modified/i.test(e.message)) throw e };

const S = { tab: "c", m: { c: new Map(), h: new Map() }, q: "", hq: "", tag: "", sort: "new", fav: false, cur: null, curH: null, limit: 40, intro: false, sy: { c: 0, h: 0 } };
const PEND = { c: [], h: [] }, FT = {}, CQ = { c: Promise.resolve(), h: Promise.resolve() };
let PV = null, FM = null;

async function getRoot(kind) {
  const c = await api("getChat", { chat_id: CH[kind] }); const pm = c.pinned_message;
  const r = pm && parseRoot(pm.text); if (r) { r.mid = pm.message_id; return r }
  const known = await mget("root:" + kind);
  if (known) { try { const m = await fwd(CH[kind], known, 0); const rr = parseRoot(m.text); if (rr) { rr.mid = known; api("pinChatMessage", { chat_id: CH[kind], message_id: known, disable_notification: true }).catch(() => { }); return rr } } catch (e) { } }
  return null
}
function mutate(e, op) {
  if (op.set) Object.assign(e, op.set);
  if (op.add) { const a = e[op.add[0]] = e[op.add[0]] || []; if (!a.includes(op.add[1])) a.push(op.add[1]) }
  if (op.rem) e[op.rem[0]] = (e[op.rem[0]] || []).filter(x => x != op.rem[1])
}
function localOp(kind, op) {
  const M = S.m[kind]; if (op.del) { M.delete(op.k); return }
  let e = M.get(op.k); if (!e) { if (op.rem) return; e = blank(kind, op.k); M.set(op.k, e) } mutate(e, op)
}
const persistOne = (kind, op) => { const e = S.m[kind].get(op.k); return op.del || !e ? idb(ROW[kind], "readwrite", s => s.delete(op.k)) : idb(ROW[kind], "readwrite", s => s.put(e)) };
const reapplyPending = kind => PEND[kind].forEach(op => localOp(kind, op));
const renderKind = kind => { rq(kind == "c" ? renderClients : renderHerbs); if (kind == "c" && PV) rq(fillProfile) };
function queueOp(kind, op) {
  const e = S.m[kind].get(op.k); if (e && e.page) op.pg = e.page;
  PEND[kind].push(op); mset("pend:" + kind, PEND[kind]); localOp(kind, op); persistOne(kind, op); renderKind(kind);
  clearTimeout(FT[kind]); FT[kind] = setTimeout(() => flushIdx(kind), 1800); setSt("Saving…")
}
const flushIdx = kind => chain(CQ, kind, () => doFlush(kind)).catch(e => { setSt("Index pending"); if (e.code !== 0) toast("Index not saved: " + e.message); clearTimeout(FT[kind]); FT[kind] = setTimeout(() => flushIdx(kind), 20000) });

async function doFlush(kind) {
  const ops = PEND[kind].slice(); if (!ops.length) return;
  const chan = CH[kind], D = KD[kind], key = D.key; setSt("Saving…");
  const root = await getRoot(kind); if (!root) throw new Error("Index missing — rebuild in Settings");
  const P = root.pages.map(p => ({ id: p.id, ver: p.ver, c: null }));
  const rd = async p => { if (!p.c) { let m; try { m = await fwd(chan, p.id, 1) } catch (e) { if (gone(e)) throw new Error("Index page missing — rebuild in Settings"); throw e } const pg = parsePage(m.text); p.c = { ents: (pg ? pg.lines : []).map(D.par).filter(Boolean), dirty: false } } return p.c };
  const find = k => P.find(p => p.c && p.c.ents.some(e => e[key] == k));
  const lastP = async () => { if (!P.length) P.push({ id: 0, ver: 0, c: { ents: [], dirty: true } }); const p = P[P.length - 1]; await rd(p); return p };
  for (const op of ops) {
    const k = op.k; let p = find(k); const lp = op.pg || (S.m[kind].get(k) || {}).page;
    if (!p && lp) { const q = P.find(x => x.id == lp); if (q) { await rd(q); if (q.c.ents.some(e => e[key] == k)) p = q } }
    if (!p && lp && !op.del && !op.rem) { for (const q of P) { await rd(q); if (q.c.ents.some(e => e[key] == k)) { p = q; break } } }
    if (op.del) { if (p) { p.c.ents = p.c.ents.filter(e => e[key] != k); p.c.dirty = true } continue }
    let e = p && p.c.ents.find(e => e[key] == k);
    if (!e) { if (op.rem) continue; e = blank(kind, k); p = await lastP(); p.c.ents.push(e) }
    mutate(e, op); p.c.dirty = true
  }
  for (let i = 0; i < P.length; i++) {
    const p = P[i]; if (!p.c || !p.c.dirty) continue; const len = () => pageText(0, p.c.ents.map(D.ser)).length;
    while (len() > PAGE_MAX && p.c.ents.length > 1) {
      const mv = p.c.ents.pop(); let np = P.find(x => !x.id && x !== p && x.c);
      if (!np || pageText(0, np.c.ents.concat(mv).map(D.ser)).length > PAGE_MAX) { np = { id: 0, ver: 0, c: { ents: [], dirty: true } }; P.push(np) } np.c.ents.push(mv)
    }
  }
  const dirty = P.filter(p => p.c && p.c.dirty);
  if (dirty.length) {
    const nv = root.v + 1;
    for (const p of dirty) {
      const text = pageText(nv, p.c.ents.map(D.ser));
      if (p.id) { try { await api("editMessageText", { chat_id: chan, message_id: p.id, text }) } catch (e) { ne(e) } }
      else { const m = await api("sendMessage", { chat_id: chan, text, disable_notification: true }); p.id = m.message_id }
      p.ver = nv
    }
    try { await api("editMessageText", { chat_id: chan, message_id: root.mid, text: rootText(nv, P.map(p => ({ id: p.id, ver: p.ver }))) }) } catch (e) { ne(e) }
  }
  PEND[kind].splice(0, ops.length); await mset("pend:" + kind, PEND[kind]);
  await syncKind(kind)
}

async function syncKind(kind, force) {
  const st = await mget("scan:" + kind); if (st) { await scanFlow(kind); return }
  const root = await getRoot(kind); if (!root) { await scanFlow(kind); return }
  mset("root:" + kind, root.mid);
  const lv = (await mget("rootv:" + kind)) || 0, pv = (await mget("pv:" + kind)) || {};
  const M = S.m[kind], D = KD[kind], key = D.key, have = new Set(root.pages.map(p => p.id));
  const stale = root.pages.filter(p => pv[p.id] !== p.ver || force === "all");
  const puts = [], dels = new Set(), old = new Map();
  for (const e of [...M.values()]) if (e.page && !have.has(e.page)) { M.delete(e[key]); dels.add(e[key]) }
  let n = 0;
  for (const p of stale) {
    setSt(`Loading index ${++n}/${stale.length}`);
    let m; try { m = await fwd(CH[kind], p.id, 1) } catch (e) { if (gone(e)) throw new Error("Index page missing — rebuild in Settings"); throw e }
    const pg = parsePage(m.text); if (!pg) continue;
    for (const e of [...M.values()]) if (e.page == p.id) { old.set(e[key], e); M.delete(e[key]); dels.add(e[key]) }
    for (const l of pg.lines) { const e = D.par(l); if (!e) continue; e.page = p.id; const o = old.get(e[key]) || M.get(e[key]); if (o && o.issue !== undefined) e.issue = o.issue; M.set(e[key], e); puts.push(e) }
    pv[p.id] = p.ver; renderKind(kind)
  }

function openViewer(r) {
  const pages = r.pages && r.pages.length ? r.pages : [r.mid], slots = pages.map((id, i) => ({ id, m: i == 0 ? r.media : null, st: 0 })), urls = [];
  const o = openSheet(`<div class="hd vbar"><button class="ib" data-a="close" aria-label="Close">${XI()}</button><b class="ttl" id="vc"></b><span style="width:38px"></span></div><div class="pager" id="pg">${slots.map((s, i) => `<div class="slide" data-i="${i}"><div class="zm"><img class="lo" alt=""><img class="hi" alt=""></div><div class="vmsg"><div class="spin"></div></div></div>`).join("")}</div>`, { cls: "vw", mod: false, nodrag: true, onclose() { urls.forEach(u => URL.revokeObjectURL(u)) } });
  const sl = $$(".slide", o); sl.forEach(attachZoom);
  const fill = async i => {
    const s = slots[i]; if (!s || s.st == 1 || s.st == 2) return; s.st = 1; const el0 = sl[i], msg = $(".vmsg", el0);
    try {
      if (!s.m) { const m = await fwd(CH.d, s.id, 0); s.m = m && mediaOf(m) } if (!s.m) throw new Error("none");
      if (s.m.kind == "pdf" || s.m.kind == "doc") { msg.innerHTML = `${ic("file")}<div style="margin-top:8px">${esc(s.m.name || "File")}</div><button class="btn" data-a="ext" data-f="${esc(s.m.full)}">Open file</button>`; s.st = 2; return }
      const lo = $(".lo", el0), hi = $(".hi", el0), tf = thumbFid(s.m);
      if (tf) IMG.get(tf, { p: 0 }).then(u => { if (u && !hi.classList.contains("in")) lo.src = u }).catch(() => { });
      const u = await IMG.get(s.m.full, { p: 0, nocache: true }); if (u.startsWith("blob:")) urls.push(u);
      hi.onload = () => { hi.classList.add("in"); lo.remove(); msg.remove() }; hi.onerror = () => { msg.innerHTML = `<div>Could not load</div><button class="btn" data-a="vretry" data-i="${i}">Retry</button>`; s.st = 0 }; hi.src = u; s.st = 2
    } catch (e) { s.st = 0; msg.innerHTML = `<div>${e.code === 0 ? "No connection" : "Could not load"}</div><button class="btn" data-a="vretry" data-i="${i}">Retry</button>` }
  };
  o.fill = fill; let cur = -1;
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { const i = +e.target.dataset.i; if (i !== cur) { if (cur >= 0) sl[cur].reset(); cur = i; setT($("#vc", o), slots.length > 1 ? `${i + 1} / ${slots.length}` : ""); fill(i); fill(i + 1); fill(i - 1) } } }), { root: $("#pg", o), threshold: .6 });
  sl.forEach(s => io.observe(s))
}

/* ---------- settings ---------- */
async function diag(o) {
  const box = $("#dg", o); const row = (ok, t, s) => `<div class="dgr ${ok ? "ok" : "no"}">${ic(ok ? "check" : "x")}<div>${esc(t)}${s ? `<small>${esc(s)}</small>` : ""}</div></div>`; let h = "";
  try {
    const me = await api("getMe");
    for (const [t, chat, mode] of [["Profiles group", CH.c, 2], ["Diet channel", CH.d, 1], ["Formulas channel", CH.h, 1]]) {
      try {
        const m = await api("getChatMember", { chat_id: chat, user_id: me.id });
        const need = mode == 1 ? [["can_post_messages", "post"], ["can_edit_messages", "edit"], ["can_delete_messages", "delete"], ["can_pin_messages", "pin"]] : [["can_delete_messages", "delete"], ["can_pin_messages", "pin"]];
        const miss = need.filter(x => !m[x[0]]).map(x => x[1]); h += row(m.status == "administrator" && !miss.length, t, m.status != "administrator" ? "Make the bot an admin" : miss.length ? "Missing rights: " + miss.join(", ") : "")
      } catch (e) { h += row(0, t, e.message) }
    }
  } catch (e) { h = row(0, "Bot", e.code === 0 ? "No connection" : e.message) }
  if ($("#dg", o)) box.innerHTML = h
}
function openSettings() {
  const o = openSheet(`<div class="grab"></div><div class="hd"><button class="ib" data-a="close" aria-label="Close">${XI()}</button><b class="ttl">Settings</b><span style="width:38px"></span></div><div class="sc"><button class="set-b" data-a="sync"><span>Sync now</span></button><button class="set-b" data-a="rebuild" data-v="c"><span>Rebuild client index<small>Full scan</small></span></button><button class="set-b" data-a="rebuild" data-v="h"><span>Rebuild formulas index<small>Full scan</small></span></button><div style="margin-top:16px" id="dg"><div class="dgr"><div class="spin" style="width:16px;height:16px"></div></div></div></div>`, { cls: "sm" }); diag(o)
}
async function rebuild(kind) {
  if (!await confirmBox("Rebuild index?", "Reads every message again. This can take a while.", "Rebuild", false)) return;
  for (const o of [...OV]) if (o.opt.cls == "sm" && $("#dg", o)) closeSheet(o);
  await mdel("scan:" + kind); DET.clear(); HC.clear(); idb("rec", "readwrite", s => s.clear());
  chain(CQ, kind, () => scanFlow(kind)).then(() => { setSt("Up to date") }).catch(e => { if (e instanceof Stop) setSt("Paused"); else { setSt("Sync failed"); toast(e.message) } })
}

/* ---------- actions ---------- */
const ACT = {

    const on = $(v == "c" ? "#pc" : "#ph"), off = $(v == "c" ? "#ph" : "#pc"); off.classList.remove("on"); on.classList.add("on", "fx"); on.addEventListener("animationend", () => on.classList.remove("fx"), { once: true });
    if (v == "h") renderHerbs(); scrollTo(0, S.sy[v] || 0)
  },
  sort(t) { S.sort = t.dataset.v; renderHerbs() }, favf() { S.fav = !S.fav; renderHerbs() },
  tag(t) { S.tag = S.tag == t.dataset.v ? "" : t.dataset.v; $("#tagrow").dataset.s = ""; renderHerbs() },

  add(t) { if (PV) openForm(t.dataset.t, { mob: PV.mob }) },
  edit(t) { const r = DET.get(+t.dataset.k); if (isLoaded(r) && PV) openForm(t.dataset.t, { rec: r, mob: PV.mob }) },
  edith() { const c = CURH, r = c && HC.get(c.mid); if (!r) return toast("Still loading"); openForm("herb", { rec: r, tags: (S.m.h.get(c.mid) || {}).tags || r.tags }) },
  view(t) { const r = DET.get(+t.dataset.k); if (isLoaded(r) && r.media) openViewer(r) },
  dchip(t) { const i = $("input", t.parentNode); i.value = t.dataset.v == "0" ? today() : yest(); syncChips(FM.o) },

  rmfile(t) { const fm = FM; const i = fm.files.findIndex(x => x.id == +t.dataset.k); if (i >= 0) { const x = fm.files[i]; if (x.url) URL.revokeObjectURL(x.url); fm.files.splice(i, 1); renderFiles() } },
  submit() { submit() },
  delrec() { if (!FM) return; if (FM.type == "profile") { const mob = FM.rec.mob, o = FM.o; closeSheet(o); deleteClient(mob) } else deleteRecord() },
  retryload() { loadClient(PV.mob); fillProfile() }, retryherb() { const c = CURH; if (!c) return; c.bad = 0; fillHerb(); readRec(CH.h, c.mid, 0).then(r => { if (r) HC.set(c.mid, r); else c.bad = 1; if (CURH === c) fillHerb() }).catch(() => { c.bad = 1; if (CURH === c) fillHerb() }) },
  reason(t) { const on = t.classList.contains("on"); $$("[data-a=reason]", FM.o).forEach(x => x.classList.remove("on")); if (!on) t.classList.add("on") },
  fchip(t) { t.classList.toggle("on") },
  gof(t) { const n = norm(t.dataset.v), e = [...S.m.h.values()].find(h => norm(h.name) == n); e ? openHerb(e.mid) : toast("Formula not found") },
  settings() { openSettings() },
  sync() { const o = $("#dg") && $("#dg").closest(".ov"); if (o) closeSheet(o); syncAll(true) },
  rebuild(t) { rebuild(t.dataset.v) },
  vretry(t) { const o = t.closest(".ov"), i = +t.dataset.i; $(".vmsg", o.querySelectorAll(".slide")[i]).innerHTML = '<div class="spin"></div>'; o.fill(i) },
  async ext(t) { const w = window.open("", "_blank"); try { const u = IMG.direct(await IMG.path(t.dataset.f)); if (w) w.location = u; else location.href = u } catch (e) { if (w) w.close(); toast("Could not open") } }
};
document.addEventListener("click", e => { const t = e.target.closest("[data-a]"); if (!t || t.disabled) return; const fn = ACT[t.dataset.a]; if (fn) fn(t, e) });

addEventListener("online", () => syncAll(false));

addEventListener("unhandledrejection", e => { if (e.reason instanceof Stop) e.preventDefault() });

/* ---------- background offline copy of all text ---------- */
async function prefetch() {
  if (prefetch.on || !navigator.onLine) return; prefetch.on = 1;
  const todo = []; S.m.h.forEach(e => { if (!HC.has(e.mid)) todo.push([CH.h, e.mid, null]) });
  S.m.c.forEach(e => { if (e.pid && !DET.has(e.pid)) todo.push([CH.c, e.pid, e.mob]); [...e.d, ...e.s, ...e.n].forEach(i => { if (!DET.has(i)) todo.push([CH.d, i, null]) }) });
  let n = 0; const t = todo.length;
  try {
    for (const [c, id, mob] of todo) {
      if (!navigator.onLine) break; if (n % 5 == 0) setSt(`Saving offline copy ${n} of ${t}`); n++;
      try {
        const r = await readRec(c, id, 3); if (!r) continue;
        if (c == CH.h) HC.set(id, r); else { DET.set(id, withPages(r)); if (mob) { const en = S.m.c.get(mob); if (en && en.issue !== (r.f.Issue || "")) { en.issue = r.f.Issue || ""; persistOne("c", { k: mob }) } } }
        if (PV) rq(fillProfile)
      } catch (e) { if (e.code === 0) break }
    }
  } finally { prefetch.on = 0; if (t) setSt(navigator.onLine ? "Up to date" : "Offline") }
}

  (rc || []).forEach(v => Map.prototype.set.call(v._c === CH.h ? HC : DET, v.mid, v));
  (pc || []).forEach(e => S.m.c.set(e.mob, e)); (ph || []).forEach(e => S.m.h.set(e.mid, e)); PEND.c = pcd || []; PEND.h = phd || []; reapplyPending("c"); reapplyPending("h");
  renderClients(); renderHerbs(); syncAll(false)
})();
